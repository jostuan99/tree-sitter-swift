name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated parser is up to date
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/

      - name: Report parser size
        run: |
          grep -E 'define (STATE_COUNT|LARGE_STATE_COUNT|SYMBOL_COUNT)' src/parser.c
          ls -l src/parser.c

      - name: Corpus, highlight and tag tests
        run: npx tree-sitter test

      - name: Type-check grammar and scripts
        run: npx tsc

      - name: Node binding tests
        run: node --test bindings/node/*_test.js

      - name: Swift binding tests
        if: runner.os == 'macOS'
        run: swift test

  rust:
    name: Rust binding
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust binding tests
        run: cargo test

  python:
    name: Python binding
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install binding
        run: pip install "tree-sitter~=0.24" .

      - name: Python binding tests
        run: python -m unittest discover -s bindings/python/tests

  smoke:
    name: Real-world smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache reference repositories
        uses: actions/cache@v4
        with:
          path: test/repos
          key: repos-${{ hashFiles('scripts/repos.txt') }}

      - name: Parse reference repositories
        run: scripts/parse-repos.sh --min-percent 99

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fuzz the parser
        run: npx tree-sitter fuzz --iterations 100

  compare:
    name: Compare with swift-syntax
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache reference repositories
        uses: actions/cache@v4
        with:
          path: test/repos
          key: repos-${{ hashFiles('scripts/repos.txt') }}

      - name: Cache swift-syntax build
        uses: actions/cache@v4
        with:
          path: scripts/compare-swift-syntax/.build
          key: swift-syntax-${{ runner.os }}-${{ hashFiles('scripts/compare-swift-syntax/Package.swift', 'scripts/compare-swift-syntax/Sources/**') }}

      - name: Clone reference repositories
        run: scripts/parse-repos.sh

      - name: Compare declarations
        run: scripts/compare-repos.sh --min-percent 99.9
